<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>채팅</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }

    /* 헤더 */
    header { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .back-btn { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
    .back-btn:hover { background: #f5f5f5; }
    .room-title { font-size: 17px; font-weight: 700; color: #1a1a2e; }
    .conn-status { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #eee; color: #888; }
    .conn-status.connected { background: #e6f9f0; color: #27ae60; }
    .conn-status.error { background: #fdecea; color: #e74c3c; }

    /* 채팅 영역 */
    .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }

    /* 메시지 */
    .msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg-row.mine { flex-direction: row-reverse; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #4f6ef7; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .avatar.mine { background: #27ae60; }
    .bubble-wrap { display: flex; flex-direction: column; max-width: 65%; }
    .msg-row.mine .bubble-wrap { align-items: flex-end; }
    .sender-name { font-size: 11px; color: #aaa; margin-bottom: 3px; }
    .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .bubble.other { background: #fff; color: #1a1a2e; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .bubble.mine { background: #4f6ef7; color: #fff; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; color: #ccc; margin-top: 3px; }

    /* 시스템 메시지 */
    .sys-msg { text-align: center; font-size: 12px; color: #bbb; padding: 4px 0; }

    /* 입력 영역 */
    .input-area { background: #fff; border-top: 1px solid #e8e8e8; padding: 14px 16px; display: flex; gap: 10px; flex-shrink: 0; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #4f6ef7; }
    .send-btn { padding: 10px 20px; background: #4f6ef7; color: #fff; border: none; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .send-btn:hover { background: #3a56d4; }
    .send-btn:disabled { background: #ccc; cursor: default; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">← 목록</button>
    <div class="room-title" id="roomTitle">채팅방</div>
    <div class="conn-status" id="connStatus">연결 중...</div>
  </header>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    <input id="msgInput" type="text" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>전송</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const params = new URLSearchParams(location.search);
    const roomId = params.get('roomId');
    const roomName = params.get('roomName') || `방 #${roomId}`;

    if (!roomId) window.location.href = '/index.html';

    document.getElementById('roomTitle').textContent = '# ' + roomName;
    document.title = '# ' + roomName;

    let stompClient = null;
    let myMemberId = null;
    let myNickname = null;

    const authHeaders = { 'Authorization': 'Bearer ' + token };

    // 현재 유저 정보 + 기존 메시지 로드 후 WebSocket 연결
    async function init() {
      try {
        const meRes = await fetch('/api/members/me', { headers: authHeaders });
        if (meRes.status === 401) { logout(); return; }
        const me = await meRes.json();
        myMemberId = me.id;
        myNickname = me.nickname;

        // 기존 메시지 내역 로드
        const histRes = await fetch(`/api/rooms/${roomId}/messages`, { headers: authHeaders });
        const messages = await histRes.json();
        messages.forEach(m => appendMessage(m, false));

        // WebSocket 연결
        connect();
      } catch (e) {
        console.error(e);
        setStatus('오류', 'error');
      }
    }

    function connect() {
      const socket = new SockJS('/ws-stomp');
      stompClient = Stomp.over(socket);
      stompClient.debug = null;

      stompClient.connect({ 'Authorization': 'Bearer ' + token }, () => {
        setStatus('연결됨', 'connected');
        document.getElementById('sendBtn').disabled = false;

        stompClient.subscribe('/topic/chat/' + roomId, (frame) => {
          const msg = JSON.parse(frame.body);
          appendMessage(msg, true);
        });

        // 입장 메시지
        sendSystemMsg('ENTER');
      }, () => {
        setStatus('연결 오류', 'error');
      });
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !stompClient || !stompClient.connected) return;

      stompClient.send('/app/chat/' + roomId, {}, JSON.stringify({
        roomId: Number(roomId),
        memberId: myMemberId,
        content: content,
        messageType: 'TALK'
      }));

      input.value = '';
    }

    function sendSystemMsg(type) {
      if (!stompClient || !stompClient.connected) return;
      stompClient.send('/app/chat/' + roomId, {}, JSON.stringify({
        roomId: Number(roomId),
        memberId: myMemberId,
        content: myNickname + (type === 'ENTER' ? '님이 입장했습니다.' : '님이 퇴장했습니다.'),
        messageType: type
      }));
    }

    function appendMessage(msg, scroll) {
      const chatArea = document.getElementById('chatArea');

      if (msg.messageType === 'ENTER' || msg.messageType === 'LEAVE') {
        const el = document.createElement('div');
        el.className = 'sys-msg';
        el.textContent = msg.content;
        chatArea.appendChild(el);
      } else {
        const isMine = msg.memberId === myMemberId;
        const nickname = msg.nickname || `User#${msg.memberId}`;
        const time = msg.createdAt ? formatTime(msg.createdAt) : '';

        const row = document.createElement('div');
        row.className = 'msg-row' + (isMine ? ' mine' : '');
        row.innerHTML = `
          <div class="avatar${isMine ? ' mine' : ''}">${nickname.charAt(0).toUpperCase()}</div>
          <div class="bubble-wrap">
            ${!isMine ? `<div class="sender-name">${escHtml(nickname)}</div>` : ''}
            <div class="bubble ${isMine ? 'mine' : 'other'}">${escHtml(msg.content)}</div>
            <div class="msg-time">${time}</div>
          </div>
        `;
        chatArea.appendChild(row);
      }

      if (scroll) chatArea.scrollTop = chatArea.scrollHeight;
    }

    function setStatus(text, cls) {
      const el = document.getElementById('connStatus');
      el.textContent = text;
      el.className = 'conn-status' + (cls ? ' ' + cls : '');
    }

    function goBack() {
      if (stompClient && stompClient.connected) {
        sendSystemMsg('LEAVE');
        stompClient.disconnect(() => window.location.href = '/index.html');
      } else {
        window.location.href = '/index.html';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    // 페이지 벗어날 때 퇴장 처리
    window.addEventListener('beforeunload', () => {
      if (stompClient && stompClient.connected) {
        sendSystemMsg('LEAVE');
      }
    });

    init();
  </script>
</body>
</html>
