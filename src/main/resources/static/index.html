<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>채팅방 목록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

    /* 헤더 */
    header { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .brand { font-size: 18px; font-weight: 700; color: #4f6ef7; }
    .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #555; }
    .logout-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: #f5f5f5; }

    /* 레이아웃 */
    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }

    /* 카드 */
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 24px; }
    .card h2 { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }

    /* 채팅방 목록 */
    .room-list { display: flex; flex-direction: column; gap: 10px; }
    .room-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid #eee; border-radius: 10px; cursor: pointer; transition: all .15s; }
    .room-item:hover { border-color: #4f6ef7; background: #f7f8ff; }
    .room-name { font-weight: 600; color: #1a1a2e; font-size: 15px; }
    .room-meta { font-size: 12px; color: #aaa; margin-top: 2px; }
    .enter-btn { padding: 6px 16px; background: #4f6ef7; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .enter-btn:hover { background: #3a56d4; }
    .empty { color: #bbb; text-align: center; padding: 32px 0; font-size: 14px; }

    /* 방 만들기 */
    .create-form { display: flex; gap: 8px; margin-bottom: 20px; }
    .create-form input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .create-form input:focus { border-color: #4f6ef7; }
    .create-form button { padding: 10px 18px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .create-form button:hover { background: #3a56d4; }

    /* 유저 검색 */
    .search-form { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-form input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .search-form input:focus { border-color: #4f6ef7; }
    .search-form button { padding: 10px 14px; background: #e8ebff; color: #4f6ef7; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .search-form button:hover { background: #d0d6ff; }
    .user-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #4f6ef7; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
    .user-name { font-size: 14px; font-weight: 600; }
    .user-id { font-size: 12px; color: #aaa; }
    .search-hint { font-size: 13px; color: #bbb; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">ChatApp</div>
    <div class="user-info">
      <span id="userDisplay">로딩 중...</span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <div class="container">
    <!-- 채팅방 목록 -->
    <div>
      <div class="card">
        <h2>채팅방 만들기</h2>
        <div class="create-form">
          <input id="newRoomName" type="text" placeholder="방 이름 입력" maxlength="50">
          <button onclick="createRoom()">만들기</button>
        </div>
      </div>

      <div class="card" style="margin-top: 16px;">
        <h2>채팅방 목록 <span id="roomCount" style="font-weight:400;color:#aaa;font-size:13px;"></span></h2>
        <div class="room-list" id="roomList">
          <div class="empty">로딩 중...</div>
        </div>
      </div>
    </div>

    <!-- 유저 검색 -->
    <div class="card" style="align-self: start;">
      <h2>유저 검색</h2>
      <div class="search-form">
        <input id="searchInput" type="text" placeholder="아이디 검색" onkeydown="if(event.key==='Enter') searchUsers()">
        <button onclick="searchUsers()">검색</button>
      </div>
      <div id="searchResults">
        <div class="search-hint">아이디를 입력해서 검색하세요</div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const authHeaders = {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };

    // 현재 유저 정보 로드
    async function loadMe() {
      try {
        const res = await fetch('/api/members/me', { headers: authHeaders });
        if (res.status === 401) { logout(); return; }
        const me = await res.json();
        document.getElementById('userDisplay').textContent = `${me.nickname} (${me.username})`;
      } catch (e) {
        console.error(e);
      }
    }

    // 채팅방 목록 로드
    async function loadRooms() {
      try {
        const res = await fetch('/api/rooms', { headers: authHeaders });
        if (res.status === 401) { logout(); return; }
        const rooms = await res.json();

        const list = document.getElementById('roomList');
        const countEl = document.getElementById('roomCount');
        countEl.textContent = `(${rooms.length})`;

        if (rooms.length === 0) {
          list.innerHTML = '<div class="empty">채팅방이 없습니다. 첫 번째 방을 만들어보세요!</div>';
          return;
        }

        list.innerHTML = rooms.map(r => `
          <div class="room-item" onclick="enterRoom(${r.id}, '${escHtml(r.name)}')">
            <div>
              <div class="room-name"># ${escHtml(r.name)}</div>
              <div class="room-meta">방 번호 ${r.id} · ${formatDate(r.createdAt)}</div>
            </div>
            <button class="enter-btn" onclick="event.stopPropagation(); enterRoom(${r.id}, '${escHtml(r.name)}')">입장</button>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    // 채팅방 생성
    async function createRoom() {
      const name = document.getElementById('newRoomName').value.trim();
      if (!name) { alert('방 이름을 입력하세요.'); return; }

      try {
        const res = await fetch('/api/rooms', {
          method: 'POST',
          headers: authHeaders,
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          document.getElementById('newRoomName').value = '';
          loadRooms();
        } else {
          alert('방 생성에 실패했습니다.');
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 채팅방 입장
    function enterRoom(roomId, roomName) {
      window.location.href = `/chat.html?roomId=${roomId}&roomName=${encodeURIComponent(roomName)}`;
    }

    // 유저 검색
    async function searchUsers() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsEl = document.getElementById('searchResults');
      resultsEl.innerHTML = '<div class="search-hint">검색 중...</div>';

      try {
        const res = await fetch(`/api/members/search?username=${encodeURIComponent(query)}`, { headers: authHeaders });
        const users = await res.json();

        if (users.length === 0) {
          resultsEl.innerHTML = '<div class="search-hint">검색 결과가 없습니다.</div>';
          return;
        }

        resultsEl.innerHTML = users.map(u => `
          <div class="user-item">
            <div class="user-avatar">${u.nickname.charAt(0).toUpperCase()}</div>
            <div>
              <div class="user-name">${escHtml(u.nickname)}</div>
              <div class="user-id">@${escHtml(u.username)}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        resultsEl.innerHTML = '<div class="search-hint">검색 중 오류가 발생했습니다.</div>';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('ko-KR');
    }

    loadMe();
    loadRooms();

    // Enter 키로 방 생성
    document.getElementById('newRoomName').addEventListener('keydown', e => {
      if (e.key === 'Enter') createRoom();
    });
  </script>
</body>
</html>
