<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); padding: 40px 36px; width: 360px; }
    h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 28px; color: #1a1a2e; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; }
    input:focus { border-color: #4f6ef7; }
    .field { margin-bottom: 16px; }
    button { width: 100%; padding: 12px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { background: #3a56d4; }
    .footer { text-align: center; margin-top: 18px; font-size: 13px; color: #888; }
    .footer a { color: #4f6ef7; text-decoration: none; }
    .error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>채팅 로그인</h1>
    <form id="loginForm">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" type="text" placeholder="아이디 입력" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
      </div>
      <button type="submit">로그인</button>
      <p class="error" id="errorMsg">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    </form>
    <div class="footer">
      계정이 없으신가요? <a href="/signup.html">회원가입</a>
    </div>
  </div>

  <script>
    // 이미 로그인된 경우 메인으로 이동
    if (localStorage.getItem('token')) {
      window.location.href = '/index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      const params = new URLSearchParams();
      params.append('username', document.getElementById('username').value);
      params.append('password', document.getElementById('password').value);

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        if (res.ok) {
          const authHeader = res.headers.get('Authorization');
          if (authHeader && authHeader.startsWith('Bearer ')) {
            localStorage.setItem('token', authHeader.substring(7));
            window.location.href = '/index.html';
          } else {
            errorMsg.style.display = 'block';
          }
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = '서버에 연결할 수 없습니다.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
